name: model5
dataset:
  root: ./data/xr-egopose    # contains TrainSet/ ValSet/ TestSet/ ; overridable from CLI
  train: TrainSet
  val: ValSet
  test: TestSet
  center_crop: true
  heatmap_size: 51
  rotation: true            # dataset additionally returns joint rotations
skeleton: '14'
transforms:
  norm: Neck
model:
  variant: full              # full | light
  rotation: true
data_loader: {batch_size: 12, shuffle: true}
val_data_loader: {batch_size: 1, shuffle: true}
train: {epochs: 7, lr: 0.0001, lr_gamma: 0.95, save_every: 5000, heatmap_div: 50, rot_div: 10}
output: {ckpt_dir: ./ckpts/model5, log_file: ./train_logs/model5.log}
eval: {output_file: ./eval_res.json}
