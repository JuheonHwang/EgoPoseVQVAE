name: vqvae1
amass:
  root: ./data/AMASS                                    # contains one sub-directory per AMASS sub-dataset
  smpl_model_root: ./data/smplpytorch/native/models     # directory holding the SMPL .pkl model files
skeleton: '14'              # AMASS poses are the 14 H36M joints used by the PoseVQVAE
model:
  down_t: 1
  fourier_features: positional   # positional | 'none'
data_loader: {batch_size: 100, shuffle: true}
test_data_loader: {batch_size: 1, shuffle: false}
train:
  epochs: 3
  lr: 0.0002
  betas: [0.9, 0.99]
  weight_decay: 0.0
  milestones: [50000, 400000]   # MultiStepLR, stepped once per epoch (as in train_VQVAE.py)
  lr_gamma: 0.05
  commit_weight: 0.02
  save_every: 5000
output: {ckpt_dir: ./ckpts/model_vqvae1, log_file: ./train_logs/vqvae1.log}
